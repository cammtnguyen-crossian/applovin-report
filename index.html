<!--
  AppLovin Performance Agent Dashboard
  =====================================
  Trước khi deploy: tìm và thay 2 dòng sau:
  1. YOUR_SUPABASE_URL  → URL từ Supabase Settings > API
  2. YOUR_SUPABASE_KEY  → Publishable key từ Supabase Settings > API Keys

  Sau đó upload file này lên GitHub repo (đổi tên thành index.html)
  và enable GitHub Pages trong Settings > Pages
-->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Report — Applovin Performance Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }
  .header { background: #1e2130; color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 16px; font-weight: 600; }
  .last-updated { font-size: 12px; color: #64748b; }
  .tabs { background: white; border-bottom: 1px solid #e2e8f0; padding: 0 24px; display: flex; }
  .tab-btn { padding: 12px 20px; border: none; background: none; font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; color: #64748b; }
  .tab-btn.active { color: #6366f1; border-bottom-color: #6366f1; }
  .filters { background: white; border-bottom: 1px solid #e2e8f0; padding: 12px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .filter-label { font-size: 12px; color: #64748b; font-weight: 500; }
  select, input[type="date"] { border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px 10px; font-size: 13px; color: #1e293b; background: white; outline: none; cursor: pointer; }
  select:focus, input:focus { border-color: #6366f1; }
  .btn-refresh { background: #6366f1; color: white; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-weight: 500; }
  .content { padding: 20px 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: white; border-radius: 10px; padding: 14px 16px; border: 1px solid #e2e8f0; }
  .card-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .card-val { font-size: 22px; font-weight: 600; }
  .card-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .table-wrap { background: white; border-radius: 10px; border: 1px solid #e2e8f0; overflow: hidden; }
  .table-header { padding: 14px 16px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
  .table-title { font-size: 14px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 14px; background: #f8fafc; color: #64748b; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
  td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbff; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge-scale { background: #dcfce7; color: #15803d; }
  .badge-keep { background: #fef9c3; color: #854d0e; }
  .badge-cut_light { background: #ffedd5; color: #c2410c; }
  .badge-cut_heavy { background: #fee2e2; color: #b91c1c; }
  .badge-suggest_pause { background: #f3e8ff; color: #7c3aed; }
  .conf { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
  .conf-dot { width: 7px; height: 7px; border-radius: 50%; }
  .conf-high .conf-dot { background: #22c55e; }
  .conf-medium .conf-dot { background: #f59e0b; }
  .conf-low .conf-dot { background: #ef4444; }
  .applied-action { font-size: 11px; font-weight: 600; color: #475569; background: #f1f5f9; border-radius: 6px; padding: 3px 8px; display: inline-block; margin-bottom: 6px; }
  .metric-block { font-size: 12px; line-height: 1.9; color: #475569; }
  .metric-row { display: flex; gap: 6px; align-items: baseline; }
  .metric-name { color: #94a3b8; font-size: 11px; width: 42px; flex-shrink: 0; }
  .up { color: #16a34a; }
  .down { color: #dc2626; }
  .flat { color: #64748b; }
  .insight-text { font-size: 12px; color: #475569; font-style: italic; }
  .creative-note { font-size: 12px; line-height: 1.5; padding: 6px 10px; border-radius: 6px; max-width: 220px; }
  .note-warn { background: #fef3c7; color: #92400e; border-left: 3px solid #f59e0b; }
  .note-good { background: #dcfce7; color: #14532d; border-left: 3px solid #22c55e; }
  .btn-copy { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; color: #475569; white-space: nowrap; }
  .btn-copy:hover { background: #e2e8f0; }
  .btn-copy.copied { background: #dcfce7; border-color: #86efac; color: #15803d; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 48px; color: #64748b; }
  [title] { position: relative; }
  .empty { text-align: center; padding: 48px; color: #94a3b8; }
  .cs-table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 12px; }
  .cs-table th { text-align: left; padding: 7px 12px; background: #f1f5f9; color: #64748b; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .4px; }
  .cs-table td { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
  .cs-table tr:last-child td { border-bottom: none; }
  .tag-new { background: #dbeafe; color: #1e40af; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-right: 4px; }
  .tag-off { background: #fee2e2; color: #b91c1c; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-right: 4px; }
  .banner { border-radius: 8px; padding: 8px 14px; margin-bottom: 8px; font-size: 12px; }
  .banner-new { background: #dbeafe; color: #1e40af; }
  .banner-off { background: #fee2e2; color: #b91c1c; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 Daily Report — Applovin Performance Agent</h1>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="btn-refresh" onclick="loadReport()">↻ Refresh</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" id="tab-daily" onclick="switchTab('daily')">Daily Report</button>
  <button class="tab-btn" id="tab-weekly" onclick="switchTab('weekly')">Weekly Report</button>
  <button class="tab-btn" id="tab-actions" onclick="switchTab('actions')">Action Impact</button>
</div>

<!-- DAILY FILTERS -->
<div class="filters" id="daily-filters">
  <span class="filter-label">Date</span>
  <input type="date" id="dateFilter" onchange="loadReport()">
  <span class="filter-label" style="margin-left:8px">Product</span>
  <select id="productFilter" onchange="loadReport()"><option value="">All products</option></select>
  <span class="filter-label" style="margin-left:8px">Action</span>
  <select id="actionFilter" onchange="loadReport()">
    <option value="">All actions</option>
    <option value="scale">Scale</option>
    <option value="keep">Keep</option>
    <option value="cut_light">Cut light</option>
    <option value="cut_heavy">Cut heavy</option>
    <option value="suggest_pause">Suggest pause</option>
  </select>
</div>

<!-- ACTION IMPACT FILTERS -->
<div class="filters" id="actions-filters" style="display:none">
  <span class="filter-label">Campaign</span>
  <select id="actionCampFilter" onchange="loadActions()" style="border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:13px">
    <option value="">All campaigns</option>
  </select>
  <span class="filter-label" style="margin-left:8px">Action Type</span>
  <select id="actionTypeFilter" onchange="loadActions()" style="border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:13px">
    <option value="">All actions</option>
    <option value="pause_creative">Pause Creative</option>
    <option value="resume_creative">Resume Creative</option>
    <option value="cut_budget">Cut Budget</option>
    <option value="scale_budget">Scale Budget</option>
  </select>
</div>

<!-- ACTION IMPACT CONTENT -->
<div class="content" id="actions-content" style="display:none">
  <div class="cards" id="action-summary-cards"></div>
  <div class="table-wrap">
    <div class="table-header">
      <span class="table-title">Action Impact Tracker</span>
      <span id="action-row-count" style="font-size:12px;color:#94a3b8"></span>
    </div>
    <div id="action-table-body"><div class="loading">Loading...</div></div>
  </div>
</div>

<!-- WEEKLY FILTERS -->
<div class="filters" id="weekly-filters" style="display:none">
  <span class="filter-label">Week of</span>
  <select id="weekFilter" onchange="loadWeekly()"><option value="">Latest week</option></select>
  <span class="filter-label" style="margin-left:8px">Product</span>
  <select id="weekProductFilter" onchange="loadWeekly()"><option value="">All products</option></select>
</div>

<!-- DAILY CONTENT -->
<div class="content" id="daily-content">
  <div class="cards" id="summaryCards"></div>
  <div class="table-wrap">
    <div class="table-header">
      <span class="table-title">Campaign Performance</span>
      <span id="rowCount" style="font-size:12px;color:#94a3b8"></span>
    </div>
    <div id="tableBody"><div class="loading">Loading...</div></div>
  </div>
</div>

<!-- WEEKLY CONTENT -->
<div class="content" id="weekly-content" style="display:none">
  <div class="cards" id="weekly-cards"></div>
  <div class="table-wrap">
    <div class="table-header">
      <span class="table-title">Weekly Campaign Performance</span>
      <span id="weekly-row-count" style="font-size:12px;color:#94a3b8"></span>
    </div>
    <div id="weekly-table-body"><div class="loading">Select a week to load data</div></div>
  </div>
</div>

<div class="toast" id="toast">Đã copy!</div>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_KEY";

// ── Init ──
const yesterday = new Date();
yesterday.setDate(yesterday.getDate() - 1);
document.getElementById('dateFilter').value = yesterday.toISOString().split('T')[0];

// ── API helper ──
async function api(path) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
  });
  return res.json();
}

// ── Tab switch ──
function switchTab(tab) {
  ['daily','weekly','actions'].forEach(t => {
    document.getElementById('tab-'+t).className = 'tab-btn' + (tab===t?' active':'');
    const f = document.getElementById(t+'-filters');
    const c = document.getElementById(t+'-content');
    if(f) f.style.display = tab===t ? 'flex' : 'none';
    if(c) c.style.display = tab===t ? 'block' : 'none';
  });
  if (tab==='weekly' && !window._weeklyInited) { initWeekly(); window._weeklyInited = true; }
  if (tab==='actions' && !window._actionsInited) { initActions(); window._actionsInited = true; }
}

// ════════════════════════════════
// DAILY REPORT
// ════════════════════════════════

function renderCreativeNote(raw) {
  if (!raw) return '<span style="color:#cbd5e1">—</span>';
  let contributors;
  try {
    const clean = cleanJson(raw);
    contributors = JSON.parse(clean);
    if (!Array.isArray(contributors)) throw new Error();
  } catch(e) {
    // Legacy text format
    const isWarn = raw.includes('⚠️');
    const isGood = raw.includes('✅');
    const cls = isWarn && isGood ? '' : isWarn ? 'note-warn' : isGood ? 'note-good' : '';
    return `<div class="creative-note ${cls}" style="font-size:11px">${raw}</div>`;
  }

  const pos = contributors.filter(c=>c.type==='positive');
  const neg = contributors.filter(c=>c.type==='negative');
  let html = '';

  if (pos.length) {
    html += pos.map(c =>
      `<div style="font-size:11px;color:#15803d;margin-bottom:3px">✅ <b>${c.name}</b>: ${c.cbh_abs} | ${c.budget_pct} budget</div>`
    ).join('');
  }
  if (neg.length) {
    html += neg.map(c =>
      `<div style="font-size:11px;color:#b91c1c;margin-bottom:3px">⚠️ <b>${c.name}</b>: ${c.cbh_abs} | ${c.budget_pct} budget${c.note?' — '+c.note:''}</div>`
    ).join('');
  }
  return html || '<span style="color:#cbd5e1">—</span>';
}

// Supabase/PostgREST sometimes returns a TEXT column value double-encoded (a JSON string
// literal wrapping the real JSON object, e.g. "{\"a\":1}" instead of {"a":1}). If so, the
// outer layer needs one real JSON.parse pass to correctly un-escape it — a naive regex
// replace of \" -> " corrupts any nested quotes inside the text (e.g. a creative set name
// wrapped in quotes) and breaks parsing entirely. Only unwrap when it's actually
// double-encoded; otherwise leave the string untouched for the real parse below.
function cleanJson(raw) {
  if (typeof raw !== 'string') return raw;
  if (raw.length > 1 && raw[0] === '"' && raw[raw.length - 1] === '"') {
    try { return JSON.parse(raw); } catch (e) { /* not actually double-encoded */ }
  }
  return raw;
}

function parseInsight(raw) {
  if (!raw) return null;
  try {
    const clean = cleanJson(raw);
    return JSON.parse(clean);
  } catch(e) { return {result_metrics: raw}; }
}

const CONF_DEF = {
  high: '3+ ngày cùng trend + spend đủ lớn (>$500)',
  medium: '2 ngày trend hoặc spend $100-500',
  low: '1 ngày data, spend thấp, hoặc pattern biến động mạnh'
};
const CONF_COLOR = { high:'#22c55e', medium:'#f59e0b', low:'#ef4444' };

function renderWeeklyInsight(raw) {
  if (!raw) return '<span style="color:#cbd5e1">—</span>';
  let parsed;
  try {
    const clean = cleanJson(raw);
    parsed = JSON.parse(clean);
  } catch(e) {
    return `<div style="font-size:12px;color:#475569;line-height:1.5">${raw}</div>`;
  }

  const layers = [
    {key:'action_review', label:'Action Review', color:'#6366f1'},
    {key:'observation', label:'Observation', color:'#3b82f6'},
    {key:'performance_driver', label:'Performance Driver', color:'#8b5cf6'},
    {key:'root_cause', label:'Root Cause', color:'#f59e0b'},
    {key:'insight', label:'Insight', color:'#10b981'},
  ];

  return layers.filter(l => parsed[l.key]).map(l =>
    `<div style="margin-bottom:8px">
      <div style="font-size:10px;font-weight:700;color:${l.color};text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">${l.label}</div>
      <div style="font-size:12px;color:#475569">${formatLayerText(parsed[l.key])}</div>
    </div>`
  ).join('');
}

function renderWeeklyRecommendation(raw) {
  if (!raw) return '<span style="color:#cbd5e1">—</span>';
  let parsed;
  try {
    const clean = cleanJson(raw);
    parsed = JSON.parse(clean);
  } catch(e) {
    return `<div style="font-size:12px;color:#1e293b;line-height:1.6;background:#fef3c7;border-left:3px solid #f59e0b;padding:8px 10px;border-radius:0 6px 6px 0">${raw}</div>`;
  }

  if (!parsed.recommendation) return '<span style="color:#cbd5e1">—</span>';
  const rec = parsed.recommendation;
  const lines = rec.split(/\n/).filter(l => l.trim());

  const html = lines.map(line => {
    const l = line.trim().replace(/^[-•*]\s*/, '');
    if (!l) return '';
    const isExpected = l.toLowerCase().includes('dự kiến') ||
                       l.toLowerCase().includes('hypothesis') ||
                       l.includes('+$') || l.includes('≈') ||
                       (l.includes('→') && (l.includes('%') || l.includes('$')));
    if (isExpected) {
      return `<div style="background:#d1fae5;border-left:3px solid #10b981;padding:5px 10px;border-radius:0 4px 4px 0;margin-top:6px;font-size:12px;color:#065f46;font-weight:500;line-height:1.4">${l}</div>`;
    }
    return `<div style="margin-bottom:4px;font-size:12px;color:#1e293b;line-height:1.4">${l}</div>`;
  }).join('');

  return `<div style="line-height:1.6;background:#fef3c7;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:0 6px 6px 0">${html}</div>`;
}

function renderWeeklyPortfolio(raw) {
  if (!raw) return '<span style="color:#cbd5e1">—</span>';
  let parsed;
  try {
    const clean = cleanJson(raw);
    parsed = JSON.parse(clean);
  } catch(e) {
    return `<div style="font-size:12px;color:#475569">${raw}</div>`;
  }
  const sections = [
    {key:'next_week_focus', label:'Next Week Focus', color:'#6366f1'},
    {key:'account_pattern', label:'Account Pattern', color:'#0ea5e9'},
    {key:'creative_portfolio', label:'Creative Portfolio', color:'#8b5cf6'},
  ];
  return sections.filter(s => parsed[s.key]).map(s =>
    `<div style="margin-bottom:8px">
      <div style="font-size:10px;font-weight:700;color:${s.color};text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">${s.label}</div>
      <div style="font-size:12px;color:#475569">${formatLayerText(parsed[s.key])}</div>
    </div>`
  ).join('');
}

function renderConfidence(conf) {
  const color = CONF_COLOR[conf] || '#64748b';
  const tip = CONF_DEF[conf] || conf;
  return `<span class="conf conf-${conf}" title="${tip}" style="cursor:help">
    <span class="conf-dot"></span>${conf}
    <span style="font-size:10px;color:#94a3b8;margin-left:2px">ⓘ</span>
  </span>`;
}

function formatLayerText(text) {
  if (!text) return '';
  // Split by | or numbered items like #1 #2 #3
  let lines = text
    .split(/\s*\|\s*|\n/)
    .map(l => l.trim())
    .filter(l => l);

  if (lines.length <= 1) {
    // Try split by #1 #2 etc
    lines = text.split(/(#\d+\s)/).filter(l => l.trim());
    // Rejoin pairs: "#1 " + content
    const merged = [];
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].match(/^#\d+\s*$/)) {
        merged.push((lines[i] + (lines[i+1]||'')).trim());
        i++;
      } else if (lines[i].trim()) {
        merged.push(lines[i].trim());
      }
    }
    lines = merged.length > 1 ? merged : [text];
  }

  return lines.map(l => {
    const clean = l.trim();
    if (!clean) return '';
    return `<div style="display:flex;gap:6px;margin-bottom:4px;line-height:1.45">
      <span style="color:#94a3b8;flex-shrink:0">•</span>
      <span>${clean}</span>
    </div>`;
  }).join('');
}

// Daily "Analysis" column — Performance Driver + Insight (Applied Action & Result Metrics
// have their own dedicated column, see renderDailyTable)
function renderInsight(raw) {
  const parsed = parseInsight(raw);
  if (!parsed) return '<span style="color:#cbd5e1">—</span>';
  const layers = [
    {key:'performance_driver', label:'Performance Driver', color:'#8b5cf6'},
    {key:'insight', label:'Insight', color:'#10b981'},
  ];
  return layers.filter(l => parsed[l.key]).map(l =>
    `<div style="margin-bottom:8px">
      <div style="font-size:10px;font-weight:700;color:${l.color};text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">${l.label}</div>
      <div style="font-size:12px;color:#475569">${formatLayerText(parsed[l.key])}</div>
    </div>`
  ).join('');
}

// Daily "Actionable Suggestion" column — Plan (renamed from "recommendation")
function renderRecommendation(raw) {
  const parsed = parseInsight(raw);
  const rec = parsed && (parsed.plan || parsed.recommendation);
  if (!rec) return '<span style="color:#cbd5e1">—</span>';

  // Split by newline or bullet points only — not by period
  const lines = rec.split(/\n|(?=\*\s)|(?=•\s)|(?=- )/).filter(l => l.trim());

  const html = lines.map(line => {
    const l = line.trim().replace(/^[-•*]\s*/, '');
    if (!l) return '';
    // Highlight expected impact lines
    const isExpected = l.toLowerCase().includes('dự kiến') ||
                       l.toLowerCase().includes('expected') ||
                       l.includes('+$') || l.includes('≈') ||
                       (l.includes('→') && (l.includes('%') || l.includes('$')));
    if (isExpected) {
      return `<div style="background:#d1fae5;border-left:3px solid #10b981;padding:5px 10px;border-radius:0 4px 4px 0;margin-top:6px;font-size:12px;color:#065f46;font-weight:500;line-height:1.4">${l}</div>`;
    }
    return `<div style="margin-bottom:4px;font-size:12px;color:#1e293b;line-height:1.4">${l}</div>`;
  }).join('');

  return `<div style="line-height:1.6;background:#fef3c7;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:0 6px 6px 0">${html}</div>`;
}

async function loadProducts() {
  const prods = await api('products?select=name&status=eq.active&order=name.asc');
  const sel = document.getElementById('productFilter');
  const selW = document.getElementById('weekProductFilter');
  prods.forEach(p => {
    [sel, selW].forEach(s => {
      const o = document.createElement('option');
      o.value = p.name; o.textContent = p.name;
      s.appendChild(o);
    });
  });
}

async function loadReport() {
  const date = document.getElementById('dateFilter').value;
  const product = document.getElementById('productFilter').value;
  const action = document.getElementById('actionFilter').value;
  document.getElementById('tableBody').innerHTML = '<div class="loading">Loading...</div>';
  document.getElementById('summaryCards').innerHTML = '';

  let url = 'v_daily_report?date=eq.' + date + '&order=product.asc,campaign.asc';
  if (product) url += '&product=eq.' + encodeURIComponent(product);
  if (action) url += '&action=eq.' + action;

  try {
    const rows = await api(url);
    window._dailyRows = rows;
    renderSummary(rows);
    renderDailyTable(rows);
    document.getElementById('rowCount').textContent = rows.length + ' campaigns';
    document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleTimeString('vi-VN');
  } catch(e) {
    document.getElementById('tableBody').innerHTML = '<div class="empty">❌ ' + e.message + '</div>';
  }
}

function renderSummary(rows) {
  const spend = rows.reduce((s,r) => s+(r.spend||0), 0);
  const avgCbh = rows.length ? (rows.reduce((s,r) => s+(r.cbh_pct||0),0)/rows.length).toFixed(1) : 0;
  const scale = rows.filter(r=>r.action==='scale').length;
  const keep = rows.filter(r=>r.action==='keep').length;
  const cut = rows.filter(r=>r.action==='cut_light'||r.action==='cut_heavy'||r.action==='suggest_pause').length;
  const cbhColor = avgCbh>=12?'#16a34a':avgCbh<0?'#dc2626':'#f59e0b';
  document.getElementById('summaryCards').innerHTML = `
    <div class="card"><div class="card-label">Campaigns</div><div class="card-val">${rows.length}</div><div class="card-sub">Live & analyzed</div></div>
    <div class="card"><div class="card-label">Total Spend</div><div class="card-val">$${spend.toLocaleString('en',{maximumFractionDigits:0})}</div><div class="card-sub">Yesterday</div></div>
    <div class="card"><div class="card-label">Avg %CBH</div><div class="card-val" style="color:${cbhColor}">${avgCbh}%</div><div class="card-sub">All campaigns</div></div>
    <div class="card"><div class="card-label">Scale</div><div class="card-val" style="color:#16a34a">${scale}</div></div>
    <div class="card"><div class="card-label">Keep</div><div class="card-val" style="color:#854d0e">${keep}</div></div>
    <div class="card"><div class="card-label">Cut / Pause</div><div class="card-val" style="color:#dc2626">${cut}</div></div>`;
}

function cbhSpan(v) {
  const n = Number(v||0);
  const c = n>=12?'#15803d':n>=8?'#16a34a':n>=0?'#f59e0b':'#dc2626';
  return `<span style="color:${c}">${n.toFixed(2)}%</span>`;
}

// Result Metrics column: %CBH + CBH ALWAYS shown; ME (spend) only shown when the
// applied action (yesterday) was not "keep" — matches the new daily report format
// where a Keep day stays terse (just the result metric), while a Scale/Cut day also
// surfaces the spend change that produced it.
function renderDailyTable(rows) {
  if (!rows.length) { document.getElementById('tableBody').innerHTML = '<div class="empty">📭 Không có data</div>'; return; }

  const actionLabel = {scale:'🚀 Scale',keep:'⏸ Keep',cut_light:'⬇ Cut light',cut_heavy:'⬇⬇ Cut heavy',suggest_pause:'🛑 Suggest pause'};
  const f$ = v => v!=null?'$'+Number(v).toLocaleString('en',{maximumFractionDigits:2}):'?';
  const fP = v => v!=null?Number(v).toFixed(2)+'%':'?';
  const dir = (prev,curr,hib=true) => curr==null||prev==null?'flat':curr>prev?(hib?'up':'down'):curr<prev?(hib?'down':'up'):'flat';
  const arr = (p,c) => c==null||p==null?'→':c>p?'↑':c<p?'↓':'→';

  const rowsHtml = rows.map((r,idx) => {
    const isKeep = r.action === 'keep';
    const metrics = [];
    if (!isKeep) metrics.push({n:'ME',p:r.prev_spend,c:r.spend,fmt:f$,hib:false});
    metrics.push({n:'%CBH',p:r.prev_cbh_pct,c:r.cbh_pct,fmt:fP,hib:true});
    metrics.push({n:'CBH',p:r.prev_cbh,c:r.cbh,fmt:f$,hib:true});

    const metricsHtml = metrics.map(m => {
      const cls = m.n==='%CBH'?'':dir(m.p,m.c,m.hib);
      const pStr = m.p!=null?m.fmt(m.p):'?';
      const cStr = m.fmt(m.c);
      const a = arr(m.p,m.c);
      if (m.n==='%CBH') {
        return `<div class="metric-row"><span class="metric-name">%CBH</span><span>${cbhSpan(m.p)} ${a} ${cbhSpan(m.c)}</span></div>`;
      }
      return `<div class="metric-row"><span class="metric-name">${m.n}</span><span class="${cls}">${pStr} ${a} ${cStr}</span></div>`;
    }).join('');

    const parsedForAction = parseInsight(r.insight);
    const appliedActionHtml = parsedForAction && parsedForAction.applied_action
      ? `<div class="applied-action">${parsedForAction.applied_action}</div>`
      : '';

    const cnoteHtml = renderCreativeNote(r.creative_note);

    return `<tr>
      <td><div style="font-weight:500">${r.campaign}</div><div style="font-size:11px;color:#94a3b8">${r.product}</div></td>
      <td>${r.action?`<span class="badge badge-${r.action}">${actionLabel[r.action]||r.action}</span>`:'—'}</td>
      <td>${appliedActionHtml}<div class="metric-block">${metricsHtml}</div></td>
      <td style="max-width:240px">
        ${renderInsight(r.insight)}
      </td>
      <td style="max-width:220px">
        ${renderRecommendation(r.insight)}
      </td>
      <td>${cnoteHtml}</td>
      <td>${r.confidence ? renderConfidence(r.confidence) : '—'}</td>
      <td><button class="btn-copy" onclick="copyDailyRow(${idx})">Copy</button></td>
    </tr>`;
  }).join('');

  document.getElementById('tableBody').innerHTML = `<table>
    <thead><tr>
      <th>Campaign</th><th>Plan (today)</th><th>Applied Action & Result Metrics</th>
      <th>Analysis</th><th>Plan Detail</th><th>Creative Contributors</th><th>Confidence</th><th></th>
    </tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>`;
}

function copyDailyRow(idx) {
  const r = window._dailyRows[idx];
  const f$ = v => v!=null?'$'+Math.round(Number(v)).toLocaleString():'?';
  const fP = v => v!=null?Number(v).toFixed(2)+'%':'?';
  const arr = (p,c) => c==null||p==null?'→':c>p?'↑':c<p?'↓':'→';
  const parsed = parseInsight(r.insight) || {};
  const lines = [];
  if (parsed.applied_action) lines.push(parsed.applied_action);
  if (r.action !== 'keep') {
    lines.push('ME: '+(r.prev_spend!=null?f$(r.prev_spend):'?')+' '+arr(r.prev_spend,r.spend)+' '+f$(r.spend));
  }
  lines.push('%CBH: '+(r.prev_cbh_pct!=null?fP(r.prev_cbh_pct):'?')+' '+arr(r.prev_cbh_pct,r.cbh_pct)+' '+fP(r.cbh_pct));
  lines.push('CBH: '+(r.prev_cbh!=null?f$(r.prev_cbh):'?')+' '+arr(r.prev_cbh,r.cbh)+' '+f$(r.cbh));
  navigator.clipboard.writeText(lines.join('\n')).then(() => showToast());
}

async function initWeekly() {
  const weeks = await api('campaign_weekly?select=week_start,week_label&order=week_start.desc');
  const unique = [...new Map(weeks.map(r=>[r.week_start,r])).values()];
  const sel = document.getElementById('weekFilter');
  unique.forEach(w => {
    const o = document.createElement('option');
    o.value = w.week_start;
    o.textContent = (w.week_label||'W?') + ' (' + w.week_start + ')';
    sel.appendChild(o);
  });
  if (unique.length) { sel.value = unique[0].week_start; loadWeekly(); }
}

async function loadWeekly() {
  const weekStart = document.getElementById('weekFilter').value;
  const product = document.getElementById('weekProductFilter').value;
  document.getElementById('weekly-table-body').innerHTML = '<div class="loading">Loading...</div>';
  document.getElementById('weekly-cards').innerHTML = '';

  try {
    // Fetch all campaign weekly data
    const allWeekly = await api('campaign_weekly?order=campaign_id.asc,week_start.desc');
    // Fetch campaign info
    const camps = await api('campaigns?select=id,name,product_id,products(name)&status=eq.active');
    const campMap = {};
    camps.forEach(c => { campMap[c.id] = {name:c.name, product:c.products?.name||''}; });

    // Group by campaign
    const byCamp = {};
    allWeekly.forEach(r => {
      if (!byCamp[r.campaign_id]) byCamp[r.campaign_id] = [];
      byCamp[r.campaign_id].push(r);
    });

    // Get W1 rows for selected week
    let w1Rows = allWeekly.filter(r => r.week_start === weekStart);
    if (!weekStart && allWeekly.length) {
      const latestWeek = allWeekly[0].week_start;
      w1Rows = allWeekly.filter(r => r.week_start === latestWeek);
    }

    // Attach campaign info
    let rows = w1Rows.map(r => ({...r, campaign: campMap[r.campaign_id]?.name||r.campaign_id, product: campMap[r.campaign_id]?.product||''}));
    if (product) rows = rows.filter(r => r.product === product);

    window._weeklyRows = rows;
    window._byCamp = byCamp;

    renderWeeklyCards(rows);
    renderWeeklyTable(rows, byCamp);
    document.getElementById('weekly-row-count').textContent = rows.length + ' campaigns';
  } catch(e) {
    document.getElementById('weekly-table-body').innerHTML = '<div class="empty">❌ ' + e.message + '</div>';
  }
}

function renderWeeklyCards(rows) {
  const spend = rows.reduce((s,r)=>s+(r.spend||0),0);
  const avg = rows.length?(rows.reduce((s,r)=>s+(r.cbh_pct||0),0)/rows.length).toFixed(1):0;
  const scale = rows.filter(r=>r.action==='scale').length;
  const cut = rows.filter(r=>r.action&&r.action.includes('cut')).length+rows.filter(r=>r.action==='suggest_pause').length;
  const cc = avg>=12?'#16a34a':avg<0?'#dc2626':'#f59e0b';
  document.getElementById('weekly-cards').innerHTML = `
    <div class="card"><div class="card-label">Campaigns</div><div class="card-val">${rows.length}</div></div>
    <div class="card"><div class="card-label">Total Spend W1</div><div class="card-val">$${spend.toLocaleString('en',{maximumFractionDigits:0})}</div></div>
    <div class="card"><div class="card-label">Avg %CBH W1</div><div class="card-val" style="color:${cc}">${avg}%</div></div>
    <div class="card"><div class="card-label">Scale</div><div class="card-val" style="color:#16a34a">${scale}</div></div>
    <div class="card"><div class="card-label">Cut / Pause</div><div class="card-val" style="color:#dc2626">${cut}</div></div>`;

function fmtW$(v) { return v!=null?'$'+Math.round(Number(v)).toLocaleString():'?'; }
function fmtWP(v) { return v!=null?Number(v).toFixed(2)+'%':'?'; }
function cbhTd(v) {

async function toggleCS(campId, btn) {
  const row = document.getElementById('cs-row-'+campId);
  const content = document.getElementById('cs-content-'+campId);
  if (row.style.display!=='none') { row.style.display='none'; btn.textContent='Creative Sets'; return; }
  row.style.display='table-row'; btn.textContent='Hide';

  try {
    const selectedWeek = document.getElementById('weekFilter').value;

    // Fetch creative sets for campaign
    const cs = await api('creative_sets?campaign_id=eq.'+campId+'&status=eq.active&select=id,name');
    if (!cs.length) { content.innerHTML='<em>Không có creative set</em>'; return; }
    const csMap = {};
    cs.forEach(c=>{ csMap[c.id]=c.name; });
    const ids = cs.map(c=>c.id).join(',');

    // Fetch weekly data
    const wd = await api('creative_weekly?creative_set_id=in.('+ids+')&order=creative_set_id.asc,week_start.desc&select=id,creative_set_id,week_start,week_label,spend,cbh_pct,cbh,created_on,suggestion');

    // Group by creative set
    const byCs = {};
    wd.forEach(r=>{ if(!byCs[r.creative_set_id])byCs[r.creative_set_id]=[]; byCs[r.creative_set_id].push(r); });

    const csWithData = Object.keys(byCs).filter(id=>csMap[id]);
    if (!csWithData.length) { content.innerHTML='<em>Chưa có weekly data</em>'; return; }

    // Detect new and offed
    const newSets=[], offedSets=[];
    csWithData.forEach(csId=>{
      const weeks=byCs[csId];
      const w1=weeks[0],w2=weeks[1];
      if(w1?.created_on && selectedWeek && w1.created_on>=selectedWeek) newSets.push({name:csMap[csId],created:w1.created_on});
      if(w2&&Number(w2.spend||0)>0&&w1&&Number(w1.spend||0)===0) offedSets.push({name:csMap[csId],w2spend:w2.spend});
    });

    let banners='';
    if(newSets.length) banners+=`<div class="banner banner-new">🆕 <b>New this week:</b> ${newSets.map(s=>s.name+' ('+s.created+')').join(' · ')}</div>`;
    if(offedSets.length) banners+=`<div class="banner banner-off">🔴 <b>Offed this week:</b> ${offedSets.map(s=>s.name+' (W2: $'+Math.round(s.w2spend)+' → W1: $0)').join(' · ')}</div>`;

    const csRows = csWithData.map((csId,ridx)=>{
      const name=csMap[csId];
      const weeks=byCs[csId];
      const w1=weeks[0],w2=weeks[1];
      const isNew=w1?.created_on&&selectedWeek&&w1.created_on>=selectedWeek;
      const isOffed=w2&&Number(w2.spend||0)>0&&w1&&Number(w1.spend||0)===0;
      const sugg=w1?.suggestion||'';
      const suggColor=sugg.includes('Tách')?'#7c3aed':sugg.includes('OFF')?'#dc2626':sugg.includes('WARNING')?'#d97706':sugg.includes('ON')?'#16a34a':'#64748b';

      // Determine status
      const w1spend = Number(w1?.spend||0);
      const w2spend = Number(w2?.spend||0);
      const isActive = w1spend > 0;
      const statusBadge = isActive
        ? '<span style="background:#dcfce7;color:#15803d;font-size:10px;padding:1px 7px;border-radius:10px;margin-right:4px;font-weight:600">ACTIVE</span>'
        : (w2spend > 0 ? '<span style="background:#fee2e2;color:#b91c1c;font-size:10px;padding:1px 7px;border-radius:10px;margin-right:4px;font-weight:600">OFF</span>' : '');

      return `<tr style="${isOffed?'opacity:0.5':''}">
        <td style="min-width:220px">
          ${isNew?'<span class="tag-new">NEW</span>':''}
          ${statusBadge}
          ${name}
        </td>
        <td style="color:#94a3b8;white-space:nowrap;font-size:11px">${w1?.created_on||'—'}</td>
        <td style="white-space:nowrap">${fmtW$(w2?.spend)} → ${fmtW$(w1?.spend)}</td>
        <td style="white-space:nowrap">${cbhTd(w2?.cbh_pct)} → ${cbhTd(w1?.cbh_pct)}</td>
        <td style="white-space:nowrap">${fmtW$(w2?.cbh)} → ${fmtW$(w1?.cbh)}</td>
        <td style="color:${suggColor};max-width:180px">${sugg||'<span style="color:#cbd5e1">—</span>'}</td>
        <td>
          <button onclick="copyCS('${name.replace(/'/g,"\\'")}','${w1?.created_on||''}',${Number(w2?.spend||0)},${Number(w1?.spend||0)},${Number(w2?.cbh_pct||0)},${Number(w1?.cbh_pct||0)},${Number(w2?.cbh||0)},${Number(w1?.cbh||0)},'${sugg.replace(/'/g,"\\'")}')" style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;color:#475569">Copy</button>
        </td>
      </tr>`;
    }).join('');

    content.innerHTML = banners + `<table class="cs-table">
      <thead><tr>
        <th>Creative Set</th><th>Created</th>
        <th>ME (W2→W1)</th><th>%CBH (W2→W1)</th><th>CBH (W2→W1)</th>
        <th>Suggestion</th><th></th>
      </tr></thead>
      <tbody>${csRows}</tbody>
    </table>`;

  } catch(e) {
    content.innerHTML='<em style="color:#ef4444">Error: '+e.message+'</em>';
  }
}

function copyCS(name,created,me2,me1,cbhp2,cbhp1,cbh2,cbh1,sugg) {
  const f$=v=>'$'+Math.round(Number(v)||0).toLocaleString();
  const fP=v=>Number(v||0).toFixed(2)+'%';
  const lines=[
    'ME: '+f$(me2)+' → '+f$(me1),
    '%CBH: '+fP(cbhp2)+' → '+fP(cbhp1),
    'CBH: '+f$(cbh2)+' → '+f$(cbh1),
  ];
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast());
}

function showToast() {
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

async function initActions() {
  // Populate campaign filter
  const camps = await api('campaigns?select=id,name&status=eq.active&order=name.asc');
  const sel = document.getElementById('actionCampFilter');
  camps.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.name;
    sel.appendChild(o);
  });

}

async function loadActions() {
  const campId = document.getElementById('actionCampFilter').value;
  const actionType = document.getElementById('actionTypeFilter').value;
  document.getElementById('action-table-body').innerHTML = '<div class="loading">Loading...</div>';

  try {
    let url = 'action_log?order=action_date.desc&limit=50';
    if (campId) url += '&campaign_id=eq.' + campId;
    if (actionType) url += '&action_type=eq.' + actionType;

    const rows = await api(url);

    // Fetch campaign names
    const camps = await api('campaigns?select=id,name&status=eq.active');
    const campMap = {};
    camps.forEach(c => campMap[c.id] = c.name);

    rows.forEach(r => r.campaign = campMap[r.campaign_id] || r.campaign_id);
    window._actionRows = rows;

    renderActionSummary(rows);
    renderActionTable(rows);
    document.getElementById('action-row-count').textContent = rows.length + ' actions';
  } catch(e) {
    document.getElementById('action-table-body').innerHTML = '<div class="empty">❌ ' + e.message + '</div>';
  }
}

function renderActionSummary(rows) {
  const withD1 = rows.filter(r => r.d1_cbh_pct != null);
  const withD3 = rows.filter(r => r.d3_cbh_pct != null);
  const withD7 = rows.filter(r => r.d7_cbh_pct != null);
  const avgD1 = withD1.length ? (withD1.reduce((s,r) => s+(r.d1_cbh_pct - r.baseline_cbh_pct),0)/withD1.length).toFixed(1) : null;
  const avgD3 = withD3.length ? (withD3.reduce((s,r) => s+(r.d3_cbh_pct - r.baseline_cbh_pct),0)/withD3.length).toFixed(1) : null;

  document.getElementById('action-summary-cards').innerHTML = `
    <div class="card"><div class="card-label">Total Actions</div><div class="card-val">${rows.length}</div><div class="card-sub">Auto-detected</div></div>
    <div class="card"><div class="card-label">Avg D+1 Impact</div><div class="card-val" style="color:${avgD1>0?'#16a34a':avgD1<0?'#dc2626':'#64748b'}">${avgD1!=null?(avgD1>0?'+':'')+avgD1+'%':'—'}</div><div class="card-sub">${withD1.length} actions tracked</div></div>
    <div class="card"><div class="card-label">Avg D+3 Impact</div><div class="card-val" style="color:${avgD3>0?'#16a34a':avgD3<0?'#dc2626':'#64748b'}">${avgD3!=null?(avgD3>0?'+':'')+avgD3+'%':'—'}</div><div class="card-sub">${withD3.length} actions tracked</div></div>
    <div class="card"><div class="card-label">Pause Actions</div><div class="card-val">${rows.filter(r=>r.action_type==='pause_creative').length}</div></div>
    <div class="card"><div class="card-label">Budget Actions</div><div class="card-val">${rows.filter(r=>r.action_type?.includes('budget')).length}</div></div>`;
}

function impactCell(baseline, actual) {
  if (actual == null) return '<span style="color:#cbd5e1">—</span>';
  const delta = Number(actual) - Number(baseline);
  const color = delta > 0 ? '#16a34a' : delta < 0 ? '#dc2626' : '#64748b';
  const sign = delta > 0 ? '+' : '';
  return `<span style="color:${color};font-weight:500">${Number(actual).toFixed(1)}%</span> <span style="font-size:11px;color:${color}">(${sign}${delta.toFixed(1)}%)</span>`;
}

function renderActionTable(rows) {
  if (!rows.length) { document.getElementById('action-table-body').innerHTML = '<div class="empty">Chưa có action nào được detect</div>'; return; }

  const typeLabel = {
    pause_creative: '⏸ Pause Creative',
    resume_creative: '▶ Resume Creative',
    cut_budget: '⬇ Cut Budget',
    scale_budget: '🚀 Scale Budget',
  };
  const typeColor = {
    pause_creative: '#fee2e2', resume_creative: '#dcfce7',
    cut_budget: '#ffedd5', scale_budget: '#dbeafe',
  };
  const typeText = {
    pause_creative: '#b91c1c', resume_creative: '#15803d',
    cut_budget: '#c2410c', scale_budget: '#1d4ed8',
  };

  const rowsHtml = rows.map(r => `
    <tr style="border-bottom:1px solid #f1f5f9">
      <td style="font-size:12px;white-space:nowrap;color:#94a3b8">${r.action_date}</td>
      <td><div style="font-weight:500;font-size:12px">${r.campaign}</div></td>
      <td><span class="badge" style="background:${typeColor[r.action_type]||'#f1f5f9'};color:${typeText[r.action_type]||'#64748b'}">${typeLabel[r.action_type]||r.action_type}</span></td>
      <td style="font-size:12px;color:#475569;max-width:200px">${r.action_target||'—'}</td>
      <td style="font-size:12px;color:#64748b">${r.action_value||'—'}</td>
      <td style="font-size:12px"><span style="color:${Number(r.baseline_cbh_pct||0)>=8?'#16a34a':Number(r.baseline_cbh_pct||0)<0?'#dc2626':'#f59e0b'};font-weight:500">${Number(r.baseline_cbh_pct||0).toFixed(1)}%</span></td>
      <td style="font-size:12px">${impactCell(r.baseline_cbh_pct, r.d1_cbh_pct)}</td>
      <td style="font-size:12px">${impactCell(r.baseline_cbh_pct, r.d3_cbh_pct)}</td>
      <td style="font-size:12px">${impactCell(r.baseline_cbh_pct, r.d7_cbh_pct)}</td>
      <td style="font-size:12px;color:#94a3b8;font-style:italic">${r.note||'—'}</td>
    </tr>`).join('');

  document.getElementById('action-table-body').innerHTML = `<table>
    <thead><tr>
      <th>Date</th><th>Campaign</th><th>Action</th><th>Target</th>
      <th>Value</th><th>Baseline %CBH</th>
      <th>D+1 %CBH</th><th>D+3 %CBH</th><th>D+7 %CBH</th><th>Note</th>
    </tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>`;
}

// ── Start ──
loadProducts().then(()=>loadReport());
</script>
</body>
</html>
